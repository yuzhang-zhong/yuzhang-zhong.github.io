<script>
  (function () {
    function initializeNewsTabs() {
      document.querySelectorAll('[data-news-tabs]').forEach(function (tabSet) {
        var tabs = Array.from(tabSet.querySelectorAll('[role="tab"]'));
        var panels = Array.from(tabSet.querySelectorAll('[role="tabpanel"]'));

        function activateTab(activeTab, moveFocus) {
          tabs.forEach(function (tab) {
            var isActive = tab === activeTab;
            tab.setAttribute('aria-selected', String(isActive));
            tab.tabIndex = isActive ? 0 : -1;
          });

          panels.forEach(function (panel) {
            panel.hidden = panel.id !== activeTab.getAttribute('aria-controls');
          });

          if (moveFocus) {
            activeTab.focus();
          }
        }

        tabs.forEach(function (tab, index) {
          tab.addEventListener('click', function () {
            activateTab(tab, false);
          });

          tab.addEventListener('keydown', function (event) {
            var nextIndex = index;
            if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
            if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
            if (event.key === 'Home') nextIndex = 0;
            if (event.key === 'End') nextIndex = tabs.length - 1;
            if (nextIndex === index) return;
            event.preventDefault();
            activateTab(tabs[nextIndex], true);
          });
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeNewsTabs);
    } else {
      initializeNewsTabs();
    }
  }());
</script>

<!-- end custom footer snippets -->
