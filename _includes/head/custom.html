<style>
  :root {
    --anthropic-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --global-bg-color: #fff;
    --global-border-color: #e2e5e9;
    --global-text-color: #252b32;
    --global-text-color-light: #67717c;
    --global-link-color: #235f9c;
    --global-link-color-hover: #164774;
    --global-link-color-visited: #235f9c;

    --global-footer-bg-color: #f7f8f9;
  }

  html,
  body {
    font-family: var(--anthropic-sans);
    font-weight: 400;
  }

  .page__content p,
  .page__content li {
    text-wrap: pretty;
    word-break: normal;
    overflow-wrap: normal;
  }

  h1, h2, h3, h4, h5, h6,
  button, input, select, textarea {
    font-family: var(--anthropic-sans);
  }

  .page__content h1,
  .page__content h2,
  .page__content h3 {
    font-family: var(--anthropic-sans);
    font-weight: 600;
    text-wrap: balance;
  }

  .nowrap {
    white-space: nowrap;
  }

  .masthead,
  .sidebar,
  .sidebar p,
  .sidebar li,
  .sidebar h2,
  .sidebar h3,
  .sidebar h4,
  .author__name,
  .author__bio,
  .author__urls,
  .page__footer,
  .page__meta,
  .archive__item-title,

  .page__content .homepage-welcome p {
    margin-bottom: 0.85rem;
    line-height: 1.6;
  }

  .homepage {
    font-family: var(--anthropic-sans);
  }

  .homepage .page__title {
    font-family: var(--anthropic-sans);
    font-size: 32px;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 1rem;
  }

  .homepage .page__content h2 {
    margin: 1.8rem 0 0.65rem;
    padding-bottom: 0;
    border-bottom: 0;
    font-size: 1.3em;
    font-weight: 600;
  }

  .homepage .page__content {
    font-size: 16px;
    line-height: 1.6;
  }

  .homepage .page__content p,
  .homepage .page__content li {

    text-underline-offset: 0.15em;
    text-decoration-thickness: 1px;

  }

    color: #53616b;
    font-size: 1em;
  }

  .welcome-kicker {
    font-family: var(--anthropic-sans);
    color: #53616b;
    font-size: 0.9em !important;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;

    font-weight: 500;
    vertical-align: 0.08em;
    white-space: nowrap;

  .name-pronunciation {
    font-size: 0.48em;

  .interest-visual {
    display: block;
    width: 100%;

    border: 1px solid rgba(44, 68, 76, 0.12);
    box-shadow: 0 10px 26px rgba(35, 54, 62, 0.06);
  }

    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;

    font-family: inherit;
    color: var(--global-text-color);
    font-weight: 600;
  }

    color: #53616b;
    font-family: var(--anthropic-sans);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.3;
    text-decoration: none;

  .home-right-nav a:focus {

    text-decoration: underline;

    margin-top: 1.4rem;
  }

  .page__content .research-interests h3,
  .page__content .project-directions h3 {
    margin: 0.95rem 0 0.28rem;
    font-size: 1.03em;
    line-height: 1.42;
  }

    margin: 0.1rem 0 0.45rem;
    color: #52666c;
    font-size: 0.93rem;
    line-height: 1.6;
  }

  .page__content .research-interests ul,
  .page__content .project-directions ul {
    margin: 0.3rem 0 0.85rem;
  }

  .page__content .research-interests li,
  .page__content .project-directions li {
    margin-bottom: 0.38rem;
    line-height: 1.6;
  }

    margin: 1rem 0 1.05rem;
  }

    margin-top: 0.75rem;
  }

  .page__content .home-news-column ul {
    margin: 0.65rem 0 0;
    padding-left: 0;
    list-style: none;
  }

    display: grid;
    grid-template-columns: 4.1em minmax(0, 1fr);
    gap: 0.45rem;
    margin-bottom: 0.4rem;
    font-size: 0.94em;
    line-height: 1.6;
  }

  .home-news-column time {
    color: var(--global-text-color-light);
    font-variant-numeric: tabular-nums;
  }

  .news-tabs {
    margin-top: 0.7rem;
  }

  .news-tabs__list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1rem;
    width: fit-content;
    max-width: 100%;
    border-bottom: 1px solid var(--global-border-color);
  }

  .news-tabs__tab {
    min-height: 44px;
    padding: 0.4rem 0;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--global-text-color-light);
    font-family: var(--anthropic-sans);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.1;
    cursor: pointer;
  }

  .news-tabs__tab:hover {
    color: var(--global-text-color);
  }

  .news-tabs__tab[aria-selected="true"] {
    border-bottom-color: var(--global-link-color);
    color: var(--global-text-color);
  }

  .news-tabs__tab:focus-visible {
    outline: 3px solid rgba(47, 103, 112, 0.28);
    outline-offset: 2px;
  }

  .news-tabs__panel {
    padding-top: 0.05rem;
  }

  .news-tabs__panel[hidden] {
    display: none;
  }

    display: grid;
    grid-template-columns: 8.6rem minmax(0, 1fr);
    gap: 1.15rem;
    align-items: start;

    overflow: hidden;
    border: 1px solid rgba(44, 68, 76, 0.14);
    border-radius: 5px;
    background: #fff;
    box-shadow: 0 6px 14px rgba(35, 54, 62, 0.08);

  .project-paper-card__thumb img {
    display: block;
    width: 100%;
    height: auto;

    margin: 0 0 0.3rem;
    font-size: 1.18rem;
    line-height: 1.25;

    text-decoration: none;
  }

  .page__content .project-paper-card__authors,
  .page__content .project-paper-card__venue,
  .page__content .project-paper-card__excerpt {

    font-size: 0.9rem;
    line-height: 1.45;
  }

    color: #294a54;
  }

  .project-paper-card__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.68rem;
  }

  .project-paper-card__actions a {

    display: inline-flex;
    align-items: center;
    min-height: 2rem;
    padding: 0.28rem 0.72rem;
    border: 1px solid rgba(47, 103, 112, 0.35);
    border-radius: 4px;
    color: #1f4f59;
    font-size: 0.78rem;
    font-weight: 700;
    line-height: 1;
    text-decoration: none;
    text-transform: uppercase;

  }

    gap: 1rem;

    padding: 0.92rem 1rem;
    border: 1px solid rgba(44, 68, 76, 0.12);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.72);
    box-shadow: 0 8px 18px rgba(35, 54, 62, 0.035);
  }

  .page__content .home-info-card h2 {

    padding-bottom: 0.35rem;
    font-size: 1.2rem;

  }

    align-items: center;

    border-top: 1px solid rgba(44, 68, 76, 0.12);
    color: #60727a;
    font-family: var(--anthropic-sans);
    font-size: 0.78rem;
    line-height: 1.2;
  }

  .visitor-counter strong {
    color: #2f6770;
    font-weight: 700;
  }

    .home-info-grid {
      grid-template-columns: 1fr;
    }

    .project-paper-card {
      grid-template-columns: 1fr;
    }

    .project-paper-card__thumb {
      max-width: 11rem;
    }

  }

  @media screen and (max-width: 600px) {
    .homepage .page__title {
      font-size: 28px;
    }

    .homepage .name-pronunciation {
      display: block;
      margin: 0.35rem 0 0;
      font-size: 12px;
      line-height: 1.3;
    }

    .home-right-nav {
      gap: 0.2rem 0.6rem;
    }

    .home-right-nav a {
      font-size: 13px;
    }
  }

  #theme-toggle {
    display: none;
  }

  .page__footer-follow i {
    display: none;
  }

  .author__urls i {
    display: inline-block;
    color: #2f6770;
    opacity: 0.88;
    margin-right: 0.34rem;
  }

  .author__urls .xhs-icon,
  .page__footer-follow .xhs-icon {
    display: inline-block;
    width: 0.9rem !important;
    height: 0.9rem !important;
    max-width: 0.9rem !important;
    margin-right: 0.34rem;
    border-radius: 4px;
    object-fit: contain;
    vertical-align: -0.12rem;
  }

  .page__footer-follow .xhs-icon {
    margin-right: 0.18rem;
  }

  .page__footer-follow a {
    text-decoration: none;
  }

  .page__footer {
    position: relative;
    bottom: auto;
